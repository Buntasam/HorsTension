# Compile l'app iPhone sur un Mac de GitHub (gratuit) et publie un fichier .ipa non signé.
# SideStore se charge ensuite de le signer avec ton compte Apple et de l'installer.
name: Build iOS (.ipa)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Chaque compilation a son propre numéro de version : SideStore voit ainsi qu'une mise à jour existe.
      - name: Numéroter la version
        run: |
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("app.json", "utf8"));
            const n = process.env.GITHUB_RUN_NUMBER;
            a.expo.version = `1.0.${n}`;
            a.expo.ios.buildNumber = String(n);
            fs.writeFileSync("app.json", JSON.stringify(a, null, 2));
            console.log("Version", a.expo.version);
          '

      - name: Générer le projet iOS
        run: npx expo prebuild --platform ios --clean
        env:
          CI: 1

      - name: Compiler (sans signature)
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE / Scheme: $SCHEME"
          set -o pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 200

      - name: Créer le fichier .ipa
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n 1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry HorsTension.ipa Payload
          ls -lh HorsTension.ipa
          plutil -convert json -o info.json "Payload/$(basename "$APP")/Info.plist"

      - name: Créer la source SideStore
        run: node scripts/make-sidestore-source.mjs HorsTension.ipa info.json "$GITHUB_RUN_NUMBER" "$GITHUB_REPOSITORY" "build-$GITHUB_RUN_NUMBER"

      - name: Garder le .ipa dans le build
        uses: actions/upload-artifact@v4
        with:
          name: HorsTension-ipa
          path: |
            HorsTension.ipa
            apps.json

      # La dernière release sert de source SideStore :
      # https://github.com/<repo>/releases/latest/download/apps.json
      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" HorsTension.ipa apps.json \
            --title "Hors Tension #${{ github.run_number }}" \
            --notes "Version compilée depuis ${GITHUB_SHA::7}. Source SideStore : https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/apps.json" \
            --latest
